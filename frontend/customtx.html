<!DOCTYPE HTML>
<html>
	<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
	<script>
		addrs = [];
		provider=null;
		_chain = 0;
		async function init() {
			try {
				// Prefer EIP-6963 discovery (MetaMask's recommended mechanism). Phantom
				// and others also inject window.ethereum, so grabbing that first can
				// pick the wrong wallet. Collect announcements, prefer MetaMask by its
				// stable rdns id, and only fall back to the injected provider after the
				// announce window.
				provider = await new Promise(function(resolve, reject) {
					var found = false;
					var seen = {};
					var best = null;   // best provider seen so far (prefer MetaMask)
					var bestIsMetaMask = false;
					function isMetaMask(p) {
						return p && p.info && p.info.rdns &&
						       p.info.rdns.toLowerCase() === 'io.metamask';
					}
					function resolveBest() {
						if (best && !found) { found = true; resolve(new Web3(best.provider)); }
					}
					function onAnnounce(e) {
						if (!e.detail || !e.detail.provider) return;
						var key = (e.detail.info && (e.detail.info.rdns || e.detail.info.uuid || e.detail.info.name)) || null;
						if (key && seen[key]) return;
						if (key) seen[key] = true;
						var mm = isMetaMask(e.detail);
						// Keep the first non-MetaMask as a candidate, but upgrade as soon as
						// a MetaMask is found (so a Phantom that announces first does not
						// hijack the connection).
						if (!best || mm || (bestIsMetaMask && !mm)) {
							best = e.detail;
							bestIsMetaMask = mm;
						}
						if (bestIsMetaMask) resolveBest(); // MetaMask is preferred -> go now
					}
					window.addEventListener('eip6963:announceProvider', onAnnounce);
					window.dispatchEvent(new Event('eip6963:requestProvider'));
					// Wait out the announce window so MetaMask gets a chance to announce;
					// then settle with the best (possibly non-MetaMask) provider, or the
					// injected provider as a last resort for wallets without EIP-6963.
					setTimeout(function() {
						if (!found) {
							if (best) {
								resolveBest();
							} else if (window.ethereum) {
								found = true;
								resolve(new Web3(window.ethereum));
							} else if (window.web3 && window.web3.currentProvider) {
								found = true;
								resolve(new Web3(window.web3.currentProvider));
							} else {
								reject(new Error('No web3 wallet provider found'));
							}
						}
					}, 600);
				});
				addrs = await provider.eth.requestAccounts();
				_chain = await provider.eth.getChainId();
			} catch (e) {
				// MetaMask can reject with its generic "Unexpected error" when its
				// connect/extension-selection step fails (e.g. conflicting wallets).
				if (e && e.message && e.message.indexOf("Unexpected error") !== -1) {
					alert("MetaMask failed to connect (unexpected error). Please refresh, close any wallet popup, disable other wallet extensions, and retry.");
				} else {
					alert(e && e.message ? e.message : e);
				}
			}
		}
		
		function send() {
			_to = document.getElementById("recipient_input").value;
			_data = document.getElementById("data_input").value;
			_gas = document.getElementById("gas_input").value;
			_gasprice = document.getElementById("gasprice_input").value;
			
			_txObject = {
				"from": addrs[0],
				"to": _to,
				"data": _data,
				"value": 0,
				"gas": _gas,
				"gasPrice": BigInt(_gasprice) * BigInt(10**9)
			}
			provider.eth.sendTransaction(_txObject);
		}
		init();
	</script>
	<div><input id="recipient_input" placeholder="Recipient address"></input></div>
	<div><input id="data_input" placeholder="Tx data"></input></div>
	<div><input id="gas_input" type="number" placeholder="Gas"></input></div>
	<div><input id="gasprice_input" type="number" placeholder="Gas price"></input></div>
	<div><button onclick="send()">Send</button></div>

</html>
